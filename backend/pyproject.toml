[project]
name = "portfolio-backend"
version = "0.1.0"
description = "API del portfolio personal de Tomas Via"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Las migraciones las genera Alembic; no tiene sentido lintear su estilo.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 choca de frente con el idioma de FastAPI: `Depends()` en el default
# del parametro es exactamente como se declaran las dependencias.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
